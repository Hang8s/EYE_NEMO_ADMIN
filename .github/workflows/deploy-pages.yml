name: Verify and deploy administration to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: test -n "$VITE_API_BASE_URL"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: npm test
      - run: npm run contracts:test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: admin
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hang8s/EYE_NEMO_BACKEND
          ref: main
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.12'
      - run: npm ci
      - run: uv sync --project ../backend --frozen
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend-readiness:
    needs: [validate, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ADMIN_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          status="$(curl --silent --show-error --output /tmp/admin-auth.json --write-out '%{http_code}' --max-time 30 "${ADMIN_API_BASE_URL%/}/admin-api/auth/me")"
          if [ "$status" = '401' ] && python -c "import json; assert json.load(open('/tmp/admin-auth.json'))['detail'] == 'Увійдіть в адміністративний обліковий запис'"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Publish the administration backend and migrations first, then rerun this workflow to deploy Pages.'
          fi

  deploy:
    needs: [validate, e2e, backend-readiness]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.backend-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
